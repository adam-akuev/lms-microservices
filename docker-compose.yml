services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: discovery-server:latest
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: lms-zipkin
    ports:
      - "9411:9411"
    networks:
      - lms-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_RABBITMQ_HOST=lms-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    image: course-service:latest
    container_name: course-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_RABBITMQ_HOST=lms-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  student-service:
    build:
      context: .
      dockerfile: student-service/Dockerfile
    image: student-service:latest
    container_name: student-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_RABBITMQ_HOST=lms-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  teacher-service:
    build:
      context: .
      dockerfile: teacher-service/Dockerfile
    image: teacher-service:latest
    container_name: teacher-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_RABBITMQ_HOST=lms-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  certificate-service:
    build:
      context: .
      dockerfile: certificate-service/Dockerfile
    image: certificate-service:latest
    container_name: certificate-service
    ports:
      - "8086:8086"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_RABBITMQ_HOST=lms-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: notification-service:latest
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_RABBITMQ_HOST=lms-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=${MAILTRAP_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAILTRAP_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - lms-network

  lms-db:
    image: postgres:17-alpine
    container_name: lms-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lms_main
    volumes:
      - lms_db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:3.7.4-management-alpine
    container_name: lms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - lms-network

volumes:
  lms_db_data:

networks:
  lms-network:
    driver: bridge